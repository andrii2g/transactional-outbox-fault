name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - run: dotnet restore TransactionalOutboxFaultLab.slnx --locked-mode
      - run: dotnet build TransactionalOutboxFaultLab.slnx -c Release --no-restore
      - run: dotnet test TransactionalOutboxFaultLab.slnx -c Release --no-build --logger trx
      - run: dotnet run --project src/OutboxFaultLab.Cli -c Release --no-build -- matrix --output artifacts/matrix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: outbox-lab-results
          path: |
            artifacts/
            **/TestResults/*.trx
